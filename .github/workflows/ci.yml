name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dispatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dispatch_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-000001
      ADMIN_EMAIL: admin@blurabbit.test
      ADMIN_PASSWORD: admin-password-1
      SERVICE_API_KEYS: svc-test-key
      ENVIRONMENT: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Type check
        run: mypy
      - name: Tests with coverage
        run: >-
          pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage gate (eta, graph, solver, plan >= 85%)
        run: python -m app.tools.coverage_gate coverage.xml
      - name: OpenAPI and upstream contract are current
        run: |
          python -m app.export_openapi /tmp/openapi.json
          diff -q /tmp/openapi.json ../web/src/api/openapi.json
          python -m app.tools.contract /tmp/datasource.openapi.yaml
          diff -q /tmp/datasource.openapi.yaml ../contracts/datasource.openapi.yaml
      - name: No em-dashes in code, docs or UI copy
        run: "! grep -rIl $'\\u2014' ../backend/app ../web/src ../docs ../contracts ../README.md"


  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run build
