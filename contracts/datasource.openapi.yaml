openapi: "3.1.0"
info:
  title: "BluRabbit DataSource contract"
  version: "1.0.0"
  description: "Endpoints the BluRabbit User App, Driver App and Admin backends expose for blurabbit-dispatch HttpSource. Each upstream has its own base URL (UPSTREAM_USERAPP_URL, UPSTREAM_DRIVERAPP_URL, UPSTREAM_ADMIN_URL) and accepts the X-API-Key header (UPSTREAM_API_KEY). All timestamps carry an offset; service dates are IST calendar days. Lists are paginated with {items, next_cursor}."
servers:
  - url: "{userapp}"
    variables:
      userapp:
        default: "https://userapp.internal"
  - url: "{driverapp}"
    variables:
      driverapp:
        default: "https://driverapp.internal"
  - url: "{admin}"
    variables:
      admin:
        default: "https://admin.internal"
